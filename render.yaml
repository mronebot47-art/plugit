services:
  - type: web
    name: plugit-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OCM_API_KEY
        value: 1c38a50a-5c0e-425c-85af-52e3fb934136
