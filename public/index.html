<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlugIt</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0E0E0B;
      color: #F2EEE6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      box-sizing: border-box;
      padding: 24px;
    }
    .badge {
      display: inline-block;
      background: #C6FF3D;
      color: #14130F;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
    }
    p {
      color: #8C887B;
      font-size: 14px;
      max-width: 280px;
      line-height: 1.4;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #2B2A24;
      border-top-color: #C6FF3D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="badge">PlugIt Mobile</div>
  <h1>Connecting...</h1>
  <p>Know where you'll charge before you leave.</p>
  <div class="spinner"></div>
</body>
</html>
