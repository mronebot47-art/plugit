<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PlugIt Mobile</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0E0E0B;
      color: #F2EEE6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #C6FF3D;
      color: #14130F;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
    }
    p {
      color: #8C887B;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.4;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #2B2A24;
      border-top-color: #C6FF3D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .card {
      background: #1B1A16;
      border: 1px solid #2B2A24;
      padding: 16px;
      border-radius: 4px;
      max-width: 340px;
      width: 100%;
      box-sizing: border-box;
    }
    input {
      width: 100%;
      padding: 10px;
      background: #0E0E0B;
      border: 1px solid #3B3930;
      color: #F2EEE6;
      border-radius: 2px;
      margin-bottom: 12px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #C6FF3D;
      color: #14130F;
      border: none;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-radius: 2px;
      cursor: pointer;
    }
    .alt-link {
      color: #8C887B;
      font-size: 12px;
      margin-top: 12px;
      display: inline-block;
      text-decoration: underline;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="badge">PlugIt Mobile</div>
  <h1>Connecting to Cockpit</h1>
  <p>Loading real-time highway corridor intelligence...</p>
  <div class="spinner"></div>

  <div class="card">
    <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #8C887B; margin-bottom: 8px;">Target Server</div>
    <input id="serverInput" type="text" value="https://accordance-enhancement-spiritual-produced.trycloudflare.com" />
    <button onclick="connect()">Connect Now</button>
    <a class="alt-link" onclick="connectLocal()">Or Connect via Local Wi-Fi (10.1.34.150)</a>
  </div>

  <script>
    const TARGET = 'https://accordance-enhancement-spiritual-produced.trycloudflare.com';
    function connect(url) {
      const dest = url || document.getElementById('serverInput').value;
      if (dest) {
        window.location.href = dest;
      }
    }
    function connectLocal() {
      connect('http://10.1.34.150:3000');
    }
    // Auto redirect after 1.2 seconds
    setTimeout(() => {
      window.location.href = TARGET;
    }, 1200);
  </script>
</body>
</html>
