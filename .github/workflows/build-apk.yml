name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # App loads a live remote URL (server.url in capacitor.config.ts).
      # We just need to ensure the webDir ("public") exists for cap sync
      # then let Capacitor copy it and update native config.
      - name: Ensure webDir exists for Capacitor
        run: mkdir -p public

      - name: Sync Capacitor
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: https://plugit-b9zk94aob-team-namee.vercel.app

      - name: Configure SDK and fix gradlew
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
